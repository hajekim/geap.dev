[project]
name = "geap-track4-custom-agents"
version = "0.1.0"
description = "Gemini Enterprise Track 4: Production Custom Agents with Google ADK 2.3.0"
authors = [{ name = "KR Customer Engineering Team", email = "kr-ce@google.com" }]
requires-python = ">=3.11,<3.14"

dependencies = [
    "google-adk[gcp,otel-gcp]>=2.2.0,<3.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0",
    "google-cloud-bigquery>=3.20.0",
    "a2a-sdk[http-server]>=0.3.22",
    "google-genai>=2.14.0",
    "pydantic>=2.10.0",
    "uvicorn>=0.34.0",
    "fastapi>=0.115.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
